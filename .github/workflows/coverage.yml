name: Coverage

on:
  push:
    branches: [ "main", "dev" ]

jobs:
  coverage:

    # gcov must be the same version as the gcc that compiled the code, and lcov
    # must understand that gcov's output. All three come from a fixed Ubuntu
    # 22.04 container (g++-11, gcov-11, lcov 1.15), so updates to the GitHub
    # runner OS do not change them.
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5

    # Build with coverage flags, run tests, and generate the coverage report,
    # inside the container. Dry run (small test subset) on dev, full on main.
    # The workspace is mounted at the same path inside the container, so file
    # paths in coverage.info match the checkout.
    - name: Build and Coverage
      continue-on-error: ${{ github.ref == 'refs/heads/main' }}
      run: |
        set -x
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          lcov_args=""
        else
          lcov_args="--dry-run"
        fi
        docker run --rm -e DEBIAN_FRONTEND=noninteractive \
          -v "$PWD":"$PWD" -w "$PWD" ubuntu:22.04 bash -c "
            set -ex
            apt-get update -y
            apt-get install -y g++-11 make liblapack-dev libblas-dev libgsl-dev lcov
            ./configure.sh --yes
            ./src/tools/lcov.sh ${lcov_args}
          "

    # Upload coverage report to Codecov
    - name: Upload coverage to Codecov
      continue-on-error: true
      if: github.ref == 'refs/heads/main' && hashFiles('coverage.info') != ''
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.info
        disable_search: true
        plugins: noop
        fail_ci_if_error: true
        verbose: true
        token: ${{ secrets.CODECOV_TOKEN }}
